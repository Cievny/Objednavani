name: Beta — spustiť nasadenie

# Prostredie github-pages povoľuje nasadenie len z vetvy main,
# preto push do bety len diaľkovo spustí deploy.yml na maine
# (ten si betu pribalí sám — buildne ju v samostatnom jobe bez
# deploy práv a s --ignore-scripts, viď deploy.yml).
#
# Hranica dôvery: tento workflow len naštartuje deploy; samotný
# beta kód sa nikdy nevykoná v jobe s pages:write. Chráňte vetvu
# beta branch-protection, nech push do nej má len dôveryhodný okruh.
on:
  push:
    branches: [beta]

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
