name: Nasadenie na GitHub Pages

# Produkcia sa stavia VŽDY z vetvy main (koreň + /sprava/),
# beta VŽDY z vetvy beta (/beta/ + /beta/sprava/). Jeden Pages web.
# Beží len na main (environment github-pages nepúšťa iné vetvy);
# push do bety ho spúšťa cez beta-redeploy.yml (workflow_dispatch).
#
# Bezpečnosť (audit vlna 6): beta kód (menej dôveryhodná vetva) sa
# builduje v samostatnom jobe BEZ deploy práv a s --ignore-scripts,
# takže nemôže bežať v privilegovanom jobe ani prepísať produkčné dist/.
# Deploy práva (pages:write, id-token) má len job „deploy", ktorý len
# skladá hotové artefakty.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # --- Produkcia z main (bez deploy práv) ---
  build-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Publishable (anon) kľúč je určený pre prehliadač — jeho zverejnenie je bezpečné.
      VITE_SUPABASE_URL: https://cfavtobowqevetlumktt.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_Mpfr8oWitG8spNC2ZsqXtQ_qlalHZ3i
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pacientskej stránky
        run: npm run build
        env:
          VITE_APP_MODE: patient
      - name: Build interného systému
        run: npx vite build --outDir dist-admin
        env:
          VITE_APP_MODE: admin
      - name: Zložiť produkčný web
        run: |
          mkdir -p out/sprava
          cp -r dist/*       out/
          cp -r dist-admin/* out/sprava/
          echo "objednanie.cievny.sk" > out/CNAME
      - uses: actions/upload-artifact@v4
        with:
          name: site-prod
          path: out

  # --- Beta z vetvy beta (bez deploy práv, bez npm lifecycle skriptov) ---
  build-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: https://cfavtobowqevetlumktt.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_Mpfr8oWitG8spNC2ZsqXtQ_qlalHZ3i
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: kód z bety nesmie spustiť postinstall a pod.
      - run: npm ci --ignore-scripts
      - name: Build beta (pacient + správa)
        run: |
          VITE_APP_MODE=patient VITE_BETA=1 npx vite build --base=/beta/
          VITE_APP_MODE=admin   VITE_BETA=1 npx vite build --base=/beta/sprava/ --outDir dist-admin
      - name: Zložiť betu
        run: |
          mkdir -p out/sprava
          cp -r dist/*       out/
          cp -r dist-admin/* out/sprava/
      - uses: actions/upload-artifact@v4
        with:
          name: site-beta
          path: out

  # --- Jediný job s deploy právami: len poskladá hotové artefakty ---
  deploy:
    needs: [build-prod, build-beta]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-prod
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: site-beta
          path: dist/beta
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
