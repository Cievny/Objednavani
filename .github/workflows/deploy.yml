name: Nasadenie na GitHub Pages

on:
  push:
    branches: [claude/usg-objednavanie, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Publishable (anon) kľúč je určený pre prehliadač — jeho zverejnenie je bezpečné.
      VITE_SUPABASE_URL: https://cfavtobowqevetlumktt.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_Mpfr8oWitG8spNC2ZsqXtQ_qlalHZ3i
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pacientskej stránky
        run: npm run build
        env:
          VITE_APP_MODE: patient
      - name: Build interného systému
        run: npx vite build --outDir dist-admin
        env:
          VITE_APP_MODE: admin
      - name: Zložiť artefakt (admin pod /sprava/)
        run: |
          mkdir -p dist/sprava
          cp -r dist-admin/* dist/sprava/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
