name: Nasadenie na GitHub Pages

# Produkcia sa stavia VŽDY z vetvy main (koreň + /sprava/),
# beta VŽDY z vetvy beta (/beta/ + /beta/sprava/) — bez ohľadu na to,
# ktorý push workflow spustil. Jeden Pages web, jedna doména.
on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Publishable (anon) kľúč je určený pre prehliadač — jeho zverejnenie je bezpečné.
      VITE_SUPABASE_URL: https://cfavtobowqevetlumktt.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_Mpfr8oWitG8spNC2ZsqXtQ_qlalHZ3i
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build pacientskej stránky
        run: npm run build
        env:
          VITE_APP_MODE: patient
      - name: Build interného systému
        run: npx vite build --outDir dist-admin
        env:
          VITE_APP_MODE: admin
      - name: Zložiť artefakt (admin pod /sprava/)
        run: |
          mkdir -p dist/sprava
          cp -r dist-admin/* dist/sprava/
          # Vlastná doména (platí pre celý web vrátane /sprava/)
          echo "objednanie.cievny.sk" > dist/CNAME

      # ---------- BETA (vetva beta -> /beta/) ----------
      - name: Checkout vetvy beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: beta-src
      - name: Build beta (pacient + správa)
        run: |
          cd beta-src
          npm ci
          VITE_APP_MODE=patient VITE_BETA=1 npx vite build --base=/beta/
          VITE_APP_MODE=admin   VITE_BETA=1 npx vite build --base=/beta/sprava/ --outDir dist-admin
      - name: Zložiť betu pod /beta/
        run: |
          mkdir -p dist/beta/sprava
          cp -r beta-src/dist/* dist/beta/
          cp -r beta-src/dist-admin/* dist/beta/sprava/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
