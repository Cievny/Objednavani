name: Nasadenie na GitHub Pages

# Produkcia sa stavia VŽDY z vetvy main (koreň + /sprava/),
# beta VŽDY z vetvy beta (/beta/ + /beta/sprava/). Jeden Pages web.
# Beží len na main (environment github-pages nepúšťa iné vetvy);
# push do bety ho spúšťa cez beta-redeploy.yml (workflow_dispatch).
#
# Bezpečnosť (audit vlna 6): beta kód (menej dôveryhodná vetva) sa
# builduje v samostatnom jobe BEZ deploy práv a s --ignore-scripts,
# takže nemôže bežať v privilegovanom jobe ani prepísať produkčné dist/.
# Deploy práva (pages:write, id-token) má len job „deploy", ktorý len
# skladá hotové artefakty.
# Audit vlna 8: všetky akcie pinnuté na commit SHA (Dependabot ich posúva),
# npm ci --ignore-scripts aj pre produkciu, VITE_PINNED_IBAN v oboch buildoch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # --- Produkcia z main (bez deploy práv) ---
  build-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Publishable (anon) kľúč je určený pre prehliadač — jeho zverejnenie je bezpečné.
      VITE_SUPABASE_URL: https://cfavtobowqevetlumktt.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_Mpfr8oWitG8spNC2ZsqXtQ_qlalHZ3i
      # Pripnutý IBAN (audit vlna 8): QR/IBAN sa pacientovi zobrazí len ak sa
      # IBAN z databázy zhoduje s týmto. Zmena účtu = runbook v GO-LIVE.md.
      VITE_PINNED_IBAN: SK5583300000002802052362
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts aj v produkcii: závislosti nesmú spúšťať lifecycle skripty
      - run: npm ci --ignore-scripts
      - name: Build pacientskej stránky
        run: npm run build
        env:
          VITE_APP_MODE: patient
      - name: Build interného systému
        run: npx vite build --outDir dist-admin
        env:
          VITE_APP_MODE: admin
      - name: Zložiť produkčný web
        run: |
          mkdir -p out/sprava
          cp -r dist/*       out/
          cp -r dist-admin/* out/sprava/
          echo "objednanie.cievny.sk" > out/CNAME
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-prod
          path: out

  # --- Beta z vetvy beta (bez deploy práv, bez npm lifecycle skriptov) ---
  build-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: https://cfavtobowqevetlumktt.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_Mpfr8oWitG8spNC2ZsqXtQ_qlalHZ3i
      VITE_PINNED_IBAN: SK5583300000002802052362
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: beta
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: kód z bety nesmie spustiť postinstall a pod.
      - run: npm ci --ignore-scripts
      - name: Build beta (pacient + správa)
        run: |
          VITE_APP_MODE=patient VITE_BETA=1 npx vite build --base=/beta/
          VITE_APP_MODE=admin   VITE_BETA=1 npx vite build --base=/beta/sprava/ --outDir dist-admin
      - name: Zložiť betu
        run: |
          mkdir -p out/sprava
          cp -r dist/*       out/
          cp -r dist-admin/* out/sprava/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-beta
          path: out

  # --- Jediný job s deploy právami: len poskladá hotové artefakty ---
  deploy:
    needs: [build-prod, build-beta]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-prod
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-beta
          path: dist/beta
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
